services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lenny_growth_db_standalone
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lenny_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lenny_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-lenny_growth_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_standalone_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lenny_user} -d ${POSTGRES_DB:-lenny_growth_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_standalone_data:
